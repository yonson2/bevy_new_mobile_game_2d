# `children![]` takes square braces, not `()` or `{}`.
standard-macro-braces = [{ name = "children", brace = "[" }]

# A seed must play the same run on every target. The std float functions call the
# platform's libm; `bevy::math::ops` calls one portable libm (Bevy's `libm` feature,
# `Cargo.toml`). A game with `f64` math adds the `libm` crate and the same rules for `f64`.
disallowed-methods = [
  { path = "f32::powi", reason = "use bevy::math::ops::FloatPow::squared, bevy::math::ops::FloatPow::cubed, or bevy::math::ops::powf instead for libm determinism" },
  { path = "f32::log", reason = "use bevy::math::ops::ln, bevy::math::ops::log2, or bevy::math::ops::log10 instead for libm determinism" },
  { path = "f32::abs_sub", reason = "deprecated and deeply confusing method" },
  { path = "f32::powf", reason = "use bevy::math::ops::powf instead for libm determinism" },
  { path = "f32::exp", reason = "use bevy::math::ops::exp instead for libm determinism" },
  { path = "f32::exp2", reason = "use bevy::math::ops::exp2 instead for libm determinism" },
  { path = "f32::ln", reason = "use bevy::math::ops::ln instead for libm determinism" },
  { path = "f32::log2", reason = "use bevy::math::ops::log2 instead for libm determinism" },
  { path = "f32::log10", reason = "use bevy::math::ops::log10 instead for libm determinism" },
  { path = "f32::cbrt", reason = "use bevy::math::ops::cbrt instead for libm determinism" },
  { path = "f32::hypot", reason = "use bevy::math::ops::hypot instead for libm determinism" },
  { path = "f32::sin", reason = "use bevy::math::ops::sin instead for libm determinism" },
  { path = "f32::cos", reason = "use bevy::math::ops::cos instead for libm determinism" },
  { path = "f32::tan", reason = "use bevy::math::ops::tan instead for libm determinism" },
  { path = "f32::asin", reason = "use bevy::math::ops::asin instead for libm determinism" },
  { path = "f32::acos", reason = "use bevy::math::ops::acos instead for libm determinism" },
  { path = "f32::atan", reason = "use bevy::math::ops::atan instead for libm determinism" },
  { path = "f32::atan2", reason = "use bevy::math::ops::atan2 instead for libm determinism" },
  { path = "f32::sin_cos", reason = "use bevy::math::ops::sin_cos instead for libm determinism" },
  { path = "f32::exp_m1", reason = "use bevy::math::ops::exp_m1 instead for libm determinism" },
  { path = "f32::ln_1p", reason = "use bevy::math::ops::ln_1p instead for libm determinism" },
  { path = "f32::sinh", reason = "use bevy::math::ops::sinh instead for libm determinism" },
  { path = "f32::cosh", reason = "use bevy::math::ops::cosh instead for libm determinism" },
  { path = "f32::tanh", reason = "use bevy::math::ops::tanh instead for libm determinism" },
  { path = "f32::asinh", reason = "use bevy::math::ops::asinh instead for libm determinism" },
  { path = "f32::acosh", reason = "use bevy::math::ops::acosh instead for libm determinism" },
  { path = "f32::atanh", reason = "use bevy::math::ops::atanh instead for libm determinism" },
  # 32-bit targets draw `usize` differently: draw `u64`.
  { path = "fastrand::Rng::usize", reason = "draw u64: 32-bit targets draw usize differently" },
  { path = "fastrand::Rng::isize", reason = "draw i64: 32-bit targets draw isize differently" },
  { path = "fastrand::Rng::choice", reason = "it draws a usize: pick with an index from u64" },
  { path = "fastrand::Rng::shuffle", reason = "it draws usizes: shuffle with u64 draws" },
  { path = "fastrand::Rng::choose_multiple", reason = "it draws usizes: pick with indices from u64" },
]
